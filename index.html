<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>nasaweb</title>
  </head>

  <body>

    <h1 id = "head">study time!</h1>

    <div id="search-container">
      <input type="text" id="search-bar" placeholder="Search" />
      <button id="search-button">⤷</button>
    </div>


    <div id = "quoteCont">
      <h3>kanye quotes ⋆✴︎˚｡⋆</h3>
      <p id="quote">get a quote from kanye!</p>
      <button id="quoteBTN" style="padding: 10px; border-radius: 15px; justify-self: center; background-color: rgb(98, 66, 34); color: white;">load new</button>
    </div>

    <div id = "picCont">
      <p id = "pictxt">nasa photo of the day  ๋࣭  ࣪ ˖ ┈ᯓ★</p>
      <img id="nasaPic" alt="apod photo">
    </div>

    <img id = "cafe" src="img/Screenshot_2026-08-28_213147-removebg-preview.png" alt="i">

    <div id="tasks">
      <p style="color: white; background-color: rgb(77, 53, 34); text-align: center; font-weight: bold;">tasks ⋆.۶ৎ ̊</p>

      <div id="task-out">
        <p style="text-align: center; color: white;">enter a task, click on it to clear it, enter clear to clear all</p>
      </div>

      <div id = "task-in">
        <input id="command-input" type="text" autocomplete="off">
      </div>
            
    </div>

    <p id = "timeElement">Time</p>

    <audio style="padding-top: 30px; position: fixed; left: 50%; transform: translateX(-50%);" controls>
      <source src="audio/Slowdive - When the Sun Hits (Audio).mp3" type="audio/mpeg">
      your browser does not support the audio tag.
    </audio>

  <div style="position: fixed; left: 50%; top: 500px; transform: translateX(-50%); display: flex;">
    <a href="https://github.com/"><img src="img/git.svg" alt="git" style="width: 50px; padding: 10px;"></a>
    <a href="https://www.pinterest.com/"><img src="img/pinterest.webp" alt="pinterest" style="width: 50px; padding: 10px;"></a>
    <a href="https://open.spotify.com/"><img src="img/spotify.png" alt="spotify" style="width: 50px; padding: 10px;"></a>
  </div>

    <script type="module" src="/src/main.js"></script>
  </body>
